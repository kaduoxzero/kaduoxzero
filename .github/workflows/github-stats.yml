name: GitHub Stats Cards

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    name: Generate Stats Cards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create assets directory
        run: mkdir -p assets

      - name: Generate Stats Card (summary-cards)
        run: |
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=kaduoxzero&theme=tokyonight" -o assets/stats.svg

      - name: Generate Repos Per Language Card (summary-cards)
        run: |
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=kaduoxzero&theme=tokyonight" -o assets/repos-per-language.svg

      - name: Generate Productive Time Card (summary-cards)
        run: |
          curl -s "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=kaduoxzero&theme=tokyonight" -o assets/productive-time.svg

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/stats.svg assets/repos-per-language.svg assets/productive-time.svg
          git diff --staged --quiet || git commit -m "chore: update stats cards SVG [skip ci]"
          git push
