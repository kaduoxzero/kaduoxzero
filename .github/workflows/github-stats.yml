name: GitHub Stats Cards

on:
  schedule:
    # Daily at 02:00 Asia/Shanghai (GitHub cron uses UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

concurrency:
  group: github-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-stats:
    name: Generate Daily Stats Cards
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Upstream hard-codes the two language cards to Top 5. Clone the same
      # release source, patch those two slices to Top 6, build it, and run it
      # locally with the existing PAT so private repositories are still counted.
      - name: Build Top 6 profile card generator
        shell: bash
        run: |
          set -euo pipefail
          CARD_TOOL_DIR="${RUNNER_TEMP}/github-profile-summary-cards"
          rm -rf "$CARD_TOOL_DIR"
          git clone --depth 1 --branch release \
            https://github.com/vn7n24fzkq/github-profile-summary-cards.git \
            "$CARD_TOOL_DIR"

          cd "$CARD_TOOL_DIR"
          sed -i 's/slice(0, 5); \/\/ get top 5/slice(0, 6); \/\/ get top 6/' \
            src/cards/repos-per-language-card.ts \
            src/cards/most-commit-language-card.ts

          test "$(grep -R -l 'slice(0, 6); // get top 6' \
            src/cards/repos-per-language-card.ts \
            src/cards/most-commit-language-card.ts | wc -l)" -eq 2

          npm ci --ignore-scripts
          npm run build

      # Aggregate-only diagnostic: no private repository names are printed.
      # Re-checks after the Kaduox-SSH Linguist override is committed.
      # It tells us whether the PAT can see private repos whose GitHub primary
      # language is Rust, and whether GitHub has a dominant-language fallback.
      - name: Check Rust visibility for stats token
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.GITHUB_TOKEN;
          const login = process.env.PROFILE_LOGIN;
          const query = `
            query($login: String!, $after: String) {
              user(login: $login) {
                repositories(ownerAffiliations: OWNER, isFork: false, first: 100, after: $after) {
                  nodes {
                    isPrivate
                    primaryLanguage { name }
                    languages(first: 1, orderBy: {field: SIZE, direction: DESC}) {
                      nodes { name }
                    }
                  }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }
          `;

          async function main() {
            let after = null;
            const repos = [];
            do {
              const response = await fetch('https://api.github.com/graphql', {
                method: 'POST',
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Content-Type': 'application/json',
                  'User-Agent': 'kaduoxzero-profile-stats'
                },
                body: JSON.stringify({query, variables: {login, after}})
              });
              if (!response.ok) throw new Error(`GitHub GraphQL HTTP ${response.status}`);
              const body = await response.json();
              if (body.errors?.length) throw new Error(body.errors.map(e => e.message).join('; '));
              const page = body.data.user.repositories;
              repos.push(...page.nodes);
              after = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (after);

            const privateRepos = repos.filter(r => r.isPrivate);
            const primaryRust = repos.filter(r => r.primaryLanguage?.name === 'Rust').length;
            const fallbackRust = repos.filter(r => (r.primaryLanguage ?? r.languages?.nodes?.[0])?.name === 'Rust').length;
            const privateNoPrimary = privateRepos.filter(r => !r.primaryLanguage).length;

            console.log(`Stats token visibility: ${repos.length} owner repos, ${privateRepos.length} private.`);
            console.log(`Rust language visibility: primary=${primaryRust}, dominant-fallback=${fallbackRust}.`);
            console.log(`Private repos without a GitHub primary language: ${privateNoPrimary}.`);
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      - name: Generate Top 6 profile cards with private repository access
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          INPUT_USERNAME: ${{ github.repository_owner }}
          INPUT_UTC_OFFSET: "8"
          INPUT_EXCLUDE: ""
          INPUT_EXCLUDE_REPOS: ""
          INPUT_AUTO_PUSH: "false"
          INPUT_THEME: "outrun"
          INPUT_ANIMATION: ""
          INPUT_DURATION: ""
          INPUT_NAME: ""
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/github-profile-summary-cards"
          node lib/app.js

      - name: Copy generated cards to README assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          SRC="${RUNNER_TEMP}/github-profile-summary-cards/profile-summary-card-output/outrun"

          cp "${SRC}/3-stats.svg" assets/stats.svg
          cp "${SRC}/1-repos-per-language.svg" assets/repos-per-language.svg
          cp "${SRC}/2-most-commit-language.svg" assets/most-commit-language.svg
          cp "${SRC}/4-productive-time.svg" assets/productive-time.svg
          cp "${SRC}/0-profile-details.svg" assets/profile-details.svg

      # Streak Stats reads GitHub's public contribution calendar. Private
      # contributions are included when the GitHub profile option
      # "Include private contributions on my profile" is enabled.
      - name: Download latest streak card
        shell: bash
        run: |
          set -euo pipefail
          CACHE_BUST="$(date +%s)"
          curl -fL --retry 3 --retry-delay 2 \
            "https://streak-stats.demolab.com?user=kaduoxzero&theme=outrun&hide_border=true&border_radius=10&v=${CACHE_BUST}" \
            -o assets/streak-stats.svg

      - name: Validate generated SVG files
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            assets/stats.svg \
            assets/repos-per-language.svg \
            assets/most-commit-language.svg \
            assets/productive-time.svg \
            assets/profile-details.svg \
            assets/streak-stats.svg; do
            test -s "$file"
            grep -qi "<svg" "$file"
          done

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/*.svg

          if git diff --staged --quiet; then
            echo "No stats changes detected."
            exit 0
          fi

          git commit -m "chore: update daily GitHub stats [skip ci]"

          # Other profile workflows may push to main at the same time.
          # Rebase and retry to avoid non-fast-forward failures.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 3
          done

          echo "Failed to push stats after 3 attempts."
          exit 1
