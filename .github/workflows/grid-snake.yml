name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    name: Generate snake animation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate GitHub contribution grid snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.METRICS_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Tune snake animation
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          files = [
              Path("dist/github-contribution-grid-snake.svg"),
              Path("dist/github-contribution-grid-snake-dark.svg"),
          ]

          for path in files:
              text = path.read_text(encoding="utf-8")

              if "23500ms" not in text:
                  raise RuntimeError(f"Expected animation duration not found in {path}")

              # Slow the full animation cycle down from 23.5s to 60s.
              text = text.replace("23500ms", "60000ms")

              # Platane/snk intentionally places the snake one row above the
              # contribution grid at the beginning/end (y = -16px). Keep the
              # snake inside the visible contribution grid instead.
              text, replacements = re.subn(
                  r"translate\(([-\d.]+px),-16px\)",
                  r"translate(\1,0px)",
                  text,
              )

              if replacements == 0:
                  raise RuntimeError(f"Expected out-of-bounds snake keyframes not found in {path}")

              path.write_text(text, encoding="utf-8")
          PY

      - name: Push snake animation to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: ${{ secrets.GIT_EMAIL }}
          commit_message: "chore: generate contribution snake"
